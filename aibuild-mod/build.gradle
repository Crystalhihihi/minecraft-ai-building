plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "aibuild" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def bridgeJarFile = file("${rootDir}/../mc-mcp-bridge/build/libs/mc-mcp-bridge-1.0.0-all.jar")

// The mc-mcp-bridge is a sibling Gradle build (not part of this build's settings),
// so invoke its own wrapper. Only runs when the shadow jar is missing; if it is
// missing and the build fails, the Exec task fails with the bridge's output.
tasks.register('buildBridgeJar', Exec) {
    group = 'build'
    description = 'Builds the mc-mcp-bridge shadow jar (sibling project) if missing.'
    workingDir file("${rootDir}/../mc-mcp-bridge")
    commandLine 'cmd', '/c', 'gradlew.bat', '--console=plain', '-q', 'shadowJar'
    onlyIf { !bridgeJarFile.isFile() }
    outputs.file bridgeJarFile
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    // Ship the bridge jar inside the mod jar; extracted to the agent work dir at runtime.
    dependsOn 'buildBridgeJar'
    from(bridgeJarFile) {
        into 'assets/aibuild'
        rename { 'mc-mcp-bridge.jar' }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
